<!-- ══ TRIDENT ELECTRIC PRO HEADER ══ -->
<!-- Drop-in fragment: no <html>/<body>, no JavaScript required -->

<style>
  .tep-header {
    --tep-navy: #0B1F33;
    --tep-blue: #0879E8;
    --tep-yellow: #FFC400;
    --tep-white: #FFFFFF;
    --tep-gray: #E8EDF2;

    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;

    background: var(--tep-navy);
    border-bottom: 3px solid var(--tep-yellow);
    box-shadow: 0 6px 28px rgba(0, 0, 0, 0.35);

    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;

    padding-top: env(safe-area-inset-top, 0px);
  }

  /* Reset only inside header */
  .tep-header *,
  .tep-header *::before,
  .tep-header *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Main container */
  .tep-inner {
    max-width: 1240px;
    height: 76px;
    margin: 0 auto;
    padding: 0 1.25rem;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 1.5rem;
  }

  /* ═════════════════════════════
     LOGO
  ═════════════════════════════ */

  .tep-logo {
    display: flex;
    align-items: center;
    text-decoration: none;
    flex-shrink: 0;
  }

  .tep-logo img {
    width: auto;
    height: 58px;
    max-width: 245px;
    display: block;
    object-fit: contain;
  }

  /* ═════════════════════════════
     NAVIGATION
  ═════════════════════════════ */

  .tep-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.15rem;

    margin-left: auto;
  }

  .tep-nav a {
    position: relative;

    color: var(--tep-white);
    text-decoration: none;

    font-size: 0.92rem;
    font-weight: 650;

    padding: 0.65rem 0.9rem;

    border-radius: 4px;

    transition:
      color 0.2s ease,
      background 0.2s ease;
  }

  .tep-nav a:hover {
    color: var(--tep-yellow);
    background: rgba(8, 121, 232, 0.15);
  }

  /* Animated yellow underline */
  .tep-nav a::after {
    content: "";

    position: absolute;
    left: 0.9rem;
    right: 0.9rem;
    bottom: 0.25rem;

    height: 2px;

    background: var(--tep-yellow);

    transform: scaleX(0);
    transform-origin: left;

    transition: transform 0.25s ease;
  }

  .tep-nav a:hover::after,
  .tep-nav a:focus-visible::after {
    transform: scaleX(1);
  }

  /* ═════════════════════════════
     PHONE / CTA
  ═════════════════════════════ */

  .tep-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 0.65rem;

    background: var(--tep-yellow);
    color: var(--tep-navy);

    text-decoration: none;

    font-weight: 800;
    font-size: 0.9rem;

    padding: 0.68rem 1.15rem;

    min-width: 185px;

    border-radius: 5px;

    white-space: nowrap;

    box-shadow: 0 5px 20px rgba(255, 196, 0, 0.25);

    transition:
      background 0.2s ease,
      transform 0.15s ease,
      box-shadow 0.2s ease;
  }

  .tep-cta:hover {
    background: #ffd333;

    transform: translateY(-1px);

    box-shadow: 0 8px 28px rgba(255, 196, 0, 0.4);
  }

  .tep-phone-icon {
    width: 23px;
    height: 23px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    font-size: 1.15rem;
    line-height: 1;
  }

  .tep-cta-text {
    display: flex;
    flex-direction: column;

    line-height: 1.15;
  }

  .tep-cta-text small {
    display: block;

    font-size: 0.58rem;
    font-weight: 800;

    letter-spacing: 0.1em;
    text-transform: uppercase;

    opacity: 0.72;

    margin-bottom: 0.18rem;
  }

  /* ═════════════════════════════
     MOBILE TOGGLE
  ═════════════════════════════ */

  .tep-toggle {
    display: none;
  }

  .tep-burger {
    display: none;

    width: 44px;
    height: 44px;

    cursor: pointer;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    gap: 5px;

    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 5px;

    background: transparent;
  }

  .tep-burger:hover {
    border-color: var(--tep-yellow);
    background: rgba(8, 121, 232, 0.12);
  }

  .tep-burger span {
    display: block;

    width: 22px;
    height: 2.5px;

    background: var(--tep-white);

    border-radius: 2px;

    transition:
      transform 0.25s ease,
      opacity 0.2s ease;
  }

  /* ═════════════════════════════
     TABLET / MOBILE
  ═════════════════════════════ */

  @media (max-width: 960px) {

    .tep-inner {
      height: 70px;
      padding: 0 1rem;
      gap: 0.75rem;
    }

    .tep-logo img {
      height: 52px;
      max-width: 220px;
    }

    .tep-burger {
      display: flex;
      order: 3;
      flex-shrink: 0;
    }

    .tep-cta {
      order: 2;

      margin-left: auto;

      min-width: auto;

      padding: 0.6rem 0.9rem;
    }

    .tep-cta-text small {
      display: none;
    }

    /* Mobile dropdown */

    .tep-nav {
      position: absolute;

      top: 100%;
      left: 0;
      right: 0;

      display: flex;
      flex-direction: column;

      align-items: stretch;

      gap: 0;

      margin: 0;

      background: var(--tep-navy);

      border-bottom: 3px solid var(--tep-yellow);

      max-height: 0;

      overflow: hidden;

      transition: max-height 0.3s ease;

      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.45);
    }

    .tep-nav a {
      padding: 1rem 1.5rem;

      border-top: 1px solid rgba(255, 255, 255, 0.1);

      font-size: 1rem;

      border-radius: 0;
    }

    .tep-nav a:hover {
      background: rgba(8, 121, 232, 0.14);
    }

    .tep-nav a::after {
      display: none;
    }

    /* Open mobile menu */

    .tep-toggle:checked ~ .tep-nav {
      max-height: 420px;
    }

    /* Hamburger animation */

    .tep-toggle:checked ~ .tep-burger span:nth-child(1) {
      transform: translateY(7.5px) rotate(45deg);
    }

    .tep-toggle:checked ~ .tep-burger span:nth-child(2) {
      opacity: 0;
    }

    .tep-toggle:checked ~ .tep-burger span:nth-child(3) {
      transform: translateY(-7.5px) rotate(-45deg);
    }
  }

  /* ═════════════════════════════
     SMALL PHONES
  ═════════════════════════════ */

  @media (max-width: 600px) {

    .tep-inner {
      height: 64px;
      padding: 0 0.8rem;
      gap: 0.5rem;
    }

    .tep-logo img {
      height: 44px;
      max-width: 175px;
    }

    .tep-cta {
      font-size: 0.78rem;
      padding: 0.52rem 0.7rem;
      gap: 0.35rem;
    }

    .tep-phone-icon {
      font-size: 1rem;
      width: 18px;
      height: 18px;
    }

    .tep-burger {
      width: 42px;
      height: 42px;
    }
  }

  @media (max-width: 400px) {

    .tep-logo img {
      height: 40px;
      max-width: 150px;
    }

    .tep-cta {
      font-size: 0.72rem;
      padding: 0.5rem 0.55rem;
    }

    .tep-burger {
      width: 40px;
      height: 40px;
    }
  }

  /* ═════════════════════════════
     ACCESSIBILITY
  ═════════════════════════════ */

  .tep-nav a:focus-visible,
  .tep-cta:focus-visible,
  .tep-burger:focus-visible,
  .tep-logo:focus-visible {
    outline: 2px solid var(--tep-yellow);
    outline-offset: 3px;
  }

  /* Prevent fixed header from covering anchor targets */
  html {
    scroll-padding-top: 90px;
  }
</style>


<header class="tep-header" role="banner">

  <div class="tep-inner">

    <!-- Mobile menu checkbox -->
    <input
      type="checkbox"
      id="tep-toggle"
      class="tep-toggle"
      aria-label="Toggle navigation menu"
    />

    <!-- Logo -->
    <a
      class="tep-logo"
      href="/"
      aria-label="Trident Electric Pro - Home"
    >
      <img
        src="/images/trident-electric-pro-logo.webp"
        alt="Trident Electric Pro"
        width="245"
        height="58"
      />
    </a>


    <!-- Navigation -->
    <nav
      class="tep-nav"
      aria-label="Main navigation"
    >
      <a href="/services/">Services</a>
      <a href="/locations/">Locations</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
    </nav>


    <!-- Phone CTA -->
    <a
      class="tep-cta"
      href="tel:+18555990507 "
      aria-label="Call Trident Electric Pro at 855-599-0507"
    >
      <span
        class="tep-phone-icon"
        aria-hidden="true"
      >
        &#9742;
      </span>

      <span class="tep-cta-text">
        <small>24/7 Emergency</small>
        (855) 599-0507
      </span>
    </a>


    <!-- Mobile hamburger -->
    <label
      for="tep-toggle"
      class="tep-burger"
      aria-label="Open navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </label>

  </div>

</header>
