<!-- /header.html : universal site header. Edit here and every page updates. Contains its own CSS. -->
<link rel="icon" type="image/webp" href="https://tridentelectricpro.com/images/trident-electric-pro-logo.webp">
<link rel="shortcut icon" type="image/webp" href="https://tridentelectricpro.com/images/trident-electric-pro-logo.webp">
<link rel="apple-touch-icon" href="https://tridentelectricpro.com/images/trident-electric-pro-logo.webp">
<style>
:root{--navy:#0B1F33;--blue:#0a6fd6;--blue-dark:#0757ad;--yellow:#FFC400;--header-h:68px}
#site-header{position:sticky;top:0;z-index:1000}
.site-header{background:rgba(11,31,51,.98);box-shadow:0 8px 25px rgba(0,0,0,.12);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.3}
.site-header *{box-sizing:border-box}
.header-inner{max-width:1240px;margin:auto;min-height:var(--header-h);padding:7px 22px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;margin-right:auto;flex:0 0 auto}
.brand img{display:block;height:54px;width:auto;max-width:none;background:#fff;border-radius:10px;padding:3px;object-fit:contain}
.main-nav{display:flex;align-items:center;gap:22px}
.main-nav a{color:#fff;font-weight:700;font-size:15px;padding:6px 0;text-decoration:none}
.main-nav a:hover,.main-nav a[aria-current="page"]{color:var(--yellow);text-decoration:none}
.header-call{display:flex;flex-direction:row;align-items:center;gap:8px;color:#fff;background:var(--blue);padding:9px 15px;border-radius:10px;line-height:1;text-decoration:none}
.header-call:hover{background:var(--blue-dark);text-decoration:none}
.header-call span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.92}
.header-call strong{font-size:16px;white-space:nowrap}
.nav-toggle,.nav-toggle-label{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:950px){.main-nav{gap:14px}.header-call{display:none}}
@media(max-width:720px){
  :root{--header-h:60px}
  .brand img{height:46px}
  .nav-toggle-label{display:flex;flex-direction:column;gap:5px;cursor:pointer}
  .nav-toggle-label .bar{display:block;width:27px;height:3px;background:#fff;border-radius:3px}
  .main-nav{position:absolute;left:0;right:0;top:60px;background:var(--navy);display:none;flex-direction:column;align-items:flex-start;padding:18px 22px;border-top:1px solid rgba(255,255,255,.1)}
  .nav-toggle:checked~.main-nav{display:flex}
}
</style>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/" aria-label="Trident Electric Pro home">
      <img src="/images/trident-electric-pro-logo.webp" alt="Trident Electric Pro logo" width="54" height="54" fetchpriority="high">
    </a>
    <input class="nav-toggle" type="checkbox" id="nav-toggle">
    <label class="nav-toggle-label" for="nav-toggle"><span class="sr-only">Open navigation</span><span class="bar"></span><span class="bar"></span><span class="bar"></span></label>
    <nav class="main-nav" aria-label="Primary navigation">
      <a href="/">Trident Electric</a>
      <a href="/services/">Services</a>
      <a href="/locations/">Locations</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
    </nav>
    <a class="header-call" href="tel:+18555990507" aria-label="Call Trident Electric at (855) 599-0507"><span>Call Now</span><strong>(855) 599-0507</strong></a>
  </div>
</header>
